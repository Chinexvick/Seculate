<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seculate — Borrow and lend what you have</title>
    <meta name="description" content="Seculate connects you with people and businesses nearby. Borrow, lend and rent everyday items, find trusted local services, and pay safely with escrow." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#16c85b" />
    <link rel="canonical" href="https://www.seculate.ng/" />

    <!-- Browser tab / bookmark / home-screen icons (Google Search needs a square icon that is a multiple of 48px).
         The ?v= suffix makes browsers fetch the new icon instead of a cached one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Start connecting to the photo CDN early (faster image loads). -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Social previews (WhatsApp, Facebook, LinkedIn, X, iMessage, Slack...) -->
