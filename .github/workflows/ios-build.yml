name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Seculate-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Seculate-ios-unsigned
          path: app/Seculate-unsigned.ipa
